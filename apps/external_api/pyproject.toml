[project]
name = "external-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "typer",
  "common",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[project.scripts]
external-api = "external_api.cli:app"
